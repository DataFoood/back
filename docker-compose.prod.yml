# Produção: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Só o Caddy (80/443, HTTPS automático via Let's Encrypt) é exposto.
# Detalhes em docs/deploy.md.
x-app: &app
  build: .
  env_file: .env.prod
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${EMBEDDING_MODEL:-nomic-embed-text}"]
    restart: "no"

  web:
    <<: *app
    environment:
      # 1 proxy confiável (Caddy) -> throttle usa o IP real do cliente
      NUM_PROXIES: ${NUM_PROXIES:-1}
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn dtfd.wsgi:application --bind 0.0.0.0:8000
               --workers ${WEB_WORKERS:-3} --timeout 90 --access-logfile -"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  shinzou:
    <<: *app
    working_dir: /app
    command: uvicorn shinzou.main:app --host 0.0.0.0 --port 8001 --workers ${SHINZOU_WORKERS:-2}
    depends_on:
      db:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: celery -A dtfd worker -l info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

  beat:
    <<: *app
    command: celery -A dtfd beat -l info --schedule /tmp/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ${FRONTEND_PATH:-../front-end}
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
    restart: unless-stopped
    depends_on:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - frontend

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  caddy_data:
  caddy_config:
