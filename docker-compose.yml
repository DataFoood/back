services:
  db:
    image: pgvector/pgvector:pg16
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Puxa o modelo de embedding (idempotente; no-op se ja existe no volume).
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${EMBEDDING_MODEL}"]
    restart: "no"

  web:
    build: .
    command: uv run python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./dtfd:/app/dtfd
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

  shinzou:
    build: .
    working_dir: /app
    command: uv run uvicorn shinzou.main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./shinzou:/app/shinzou
    ports:
      - "8001:8001"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

  worker:
    build: .
    working_dir: /app/dtfd
    command: uv run celery -A dtfd worker -l info
    volumes:
      - ./dtfd:/app/dtfd
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

  beat:
    build: .
    working_dir: /app/dtfd
    command: uv run celery -A dtfd beat -l info
    volumes:
      - ./dtfd:/app/dtfd
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data:
