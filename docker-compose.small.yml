# Instalação independente para 2 GiB: imagens prontas, sem build, com embeddings limitados.
# docker compose -f docker-compose.small.yml --env-file .env.prod up -d --no-build
x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: ${BACKEND_IMAGE:?Defina BACKEND_IMAGE com uma imagem amd64 pronta}
  env_file: .env.prod
  restart: unless-stopped
  logging: *logging
  environment:
    SEMANTIC_SEARCH_ENABLED: ${SEMANTIC_SEARCH_ENABLED:-True}
    EMBEDDING_KEEP_ALIVE: "0"
    EMBEDDING_NUM_CTX: "512"
    EMBEDDING_NUM_BATCH: "32"
    EMBEDDING_NUM_THREAD: "1"
    NUM_PROXIES: "1"
    TELEGRAM_POLL_SECONDS: "60"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=30
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 96m
    # Redis compartilha cache e broker: não descartar tarefas por eviction.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "32mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    <<: *app
    mem_limit: 192m
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        exec gunicorn dtfd.wsgi:application --bind 0.0.0.0:8000
        --workers 1 --threads 2 --timeout 60 --access-logfile -
        --max-requests 500 --max-requests-jitter 50
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  ollama:
    image: ollama/ollama:0.30.11
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    environment:
      OLLAMA_KEEP_ALIVE: "0"
      OLLAMA_CONTEXT_LENGTH: "512"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "2"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 10

  ollama-init:
    image: ollama/ollama:0.30.11
    logging: *logging
    mem_limit: 64m
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${EMBEDDING_MODEL:-nomic-embed-text:v1.5}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  shinzou:
    <<: *app
    mem_limit: 128m
    working_dir: /app
    command: uvicorn shinzou.main:app --host 0.0.0.0 --port 8001 --workers 1 --limit-concurrency 2
    environment:
      EMBEDDING_KEEP_ALIVE: "0"
      EMBEDDING_NUM_CTX: "512"
      EMBEDDING_NUM_BATCH: "32"
      EMBEDDING_NUM_THREAD: "1"
      SHINZOU_DB_POOL_MAX: "2"
    depends_on:
      web:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

  worker:
    <<: *app
    mem_limit: 160m
    command: celery -A dtfd worker -l info --pool solo --concurrency 1 --prefetch-multiplier 1 --without-gossip --without-mingle
    depends_on:
      web:
        condition: service_healthy

  beat:
    <<: *app
    mem_limit: 96m
    command: celery -A dtfd beat -l info --schedule /tmp/celerybeat-schedule
    depends_on:
      web:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:?Defina FRONTEND_IMAGE com uma imagem amd64 pronta}
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    environment:
      NODE_OPTIONS: --max-old-space-size=128
    depends_on:
      web:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 64m
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  ollama_data:
